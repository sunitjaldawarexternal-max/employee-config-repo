server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:empdb
    driverClassName: org.h2.Driver
    datasource:
      username: "sa"
      password: ""
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

reference:
  service:
    url: "http://localhost:8081/api/references/"
